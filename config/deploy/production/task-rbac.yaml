apiVersion: v1
kind: ServiceAccount
metadata:
  name: shipit-task-launcher
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shipit-task
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipit-task-launcher
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipit-task-launcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shipit-task-launcher
subjects:
  - kind: ServiceAccount
    name: shipit-task-launcher
    namespace: shipit
