services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: shipit
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

volumes:
  db_data: {}
