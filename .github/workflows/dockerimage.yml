name: Docker Image

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

concurrency:
  group: docker-image-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  IMAGE: 048268392960.dkr.ecr.us-west-2.amazonaws.com/rubygems/shipit
  REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Docker build ${{ matrix.arch }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.REVISION }}
        persist-credentials: false

    - name: Set REVISION
      run: echo "$REVISION" > REVISION

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::048268392960:role/shipit-ecr-pusher
        aws-region: us-west-2

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Build and push Docker image
      run: docker buildx build . --platform "linux/${{ matrix.arch }}" --tag "$IMAGE:$REVISION-${{ matrix.arch }}" --push

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::048268392960:role/shipit-ecr-pusher
        aws-region: us-west-2

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Push multi-arch manifest
      run: |
        docker buildx imagetools create --tag "$IMAGE:$REVISION" "$IMAGE:$REVISION-amd64" "$IMAGE:$REVISION-arm64"
        docker buildx imagetools inspect "$IMAGE:$REVISION"
        echo "Pushed multi-arch image \`$IMAGE:$REVISION\`" >> "$GITHUB_STEP_SUMMARY"
